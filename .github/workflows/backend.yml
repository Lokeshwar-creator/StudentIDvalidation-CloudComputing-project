name: Deploy Flask Backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cc/student-id-validation/requirements.txt

      - name: Archive backend app for deployment
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: cc/student-id-validation

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_BACKEND_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_BACKEND_TENANTID }}
          subscription-id: ${{ secrets.AZURE_BACKEND_SUBSCRIPTIONID }}

      - name: Deploy to Azure Web App (Flask Backend)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "student-id-backend"       # <-- Your backend App Service name
          slot-name: "Production"
